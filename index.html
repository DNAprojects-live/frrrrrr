.tabs{display:inline-flex;gap:2px;margin:16px 0 4px;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--card);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:11px;color:var(--mut);font-weight:600}.tabs button.on{background:var(--acc);color:#fff}
h2{margin:34px 0 2px;font-size:24px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.work{display:block;transition:.25s}.work:hover{transform:translateY(-4px);border-color:var(--hi)}
